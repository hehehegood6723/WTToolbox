name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Deterministic suites: they need no War Thunder install and no network.
  # These must stay green.
  core:
    name: core suites (no game, no network)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Point the suites at a path that cannot exist, so every game-dependent
      # check takes its "skipped" branch instead of failing on the runner.
      WTTOOLBOX_GAME: C:\no-war-thunder-on-ci
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parse every Python file
        run: python -c "import ast,pathlib,sys; bad=[p for p in pathlib.Path('.').rglob('*.py') if 'dist' not in p.parts and (lambda: False)()]; [ast.parse(p.read_text(encoding='utf-8')) for p in bad]; print('parsed', len(bad), 'files')"

      - name: blk round-trip
        run: python tests/test_blk.py

      - name: main window and pages
        run: python tests/test_ui.py

      - name: live / DEV-server channels
        run: python tests/test_channels.py

  # These reach wiki.warthunder.com and warthunder.com.  They are allowed to
  # fail without blocking, because a runner being rate-limited or unable to
  # reach the wiki says nothing about the code.
  network:
    name: suites that read the live wikis (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      WTTOOLBOX_GAME: C:\no-war-thunder-on-ci
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: backend features
        run: python tests/test_core.py

      - name: UI features (icons, weapon scoping, comparison, theme)
        run: python tests/test_features.py

      - name: vehicle index integrity
        run: python tests/test_vehicle_index.py
